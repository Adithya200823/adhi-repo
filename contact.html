<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #12232c;
      color: #e8ecee;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 35px;
      padding: 0 12px;
      background: #14252e;
      border-bottom: 1px solid #2a414c;
    }

    nav a {
      color: #e5e9eb;
      text-decoration: none;
      font-size: 16px;
      padding: 24px 0 18px;
    }

    nav a.active {
      color: #38d6bd;
      border-bottom: 3px solid #38d6bd;
    }

    .theme-btn {
      background: transparent;
      color: #e8ecee;
      border: 3px solid #f6b925;
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .contact-container {
      width: 573px;
      max-width: 92%;
      margin: 0 auto;
      padding: 30px 40px 39px;
      background: #162831;
      border: 1px solid #2b424d;
      border-top: none;
      border-radius: 0 0 7px 7px;
    }

    .form-group {
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      background: #0d1921;
      color: white;
      border: 1px solid #304753;
      border-radius: 7px;
      outline: none;
      font-size: 16px;
      padding: 12px;
    }

    input {
      height: 59px;
    }

    textarea {
      height: 188px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #f6b925;
    }

    .prepare-btn {
      height: 68px;
      padding: 0 29px;
      background: #f7b92b;
      color: #111a20;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .prepare-btn:hover {
      background: #ffc33d;
    }

    @media (max-width: 650px) {
      nav {
        gap: 18px;
      }

      .contact-container {
        width: 100%;
        max-width: 100%;
        padding-left: 24px;
        padding-right: 24px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="#">Courses</a>
    <a href="#" class="active">Contact</a>

    <button class="theme-btn">
      Light mode
    </button>
  </nav>


  <div class="contact-container">

    <form>

      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
        >
      </div>


      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
        >
      </div>


      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
        ></textarea>
      </div>


      <button
        type="submit"
        class="prepare-btn"
      >
        Prepare message
      </button>

    </form>

  </div>


  <script>

    const themeButton =
      document.querySelector(".theme-btn");

    themeButton.addEventListener("click", () => {

      document.body.classList.toggle("light");

      if (
        document.body.classList.contains("light")
      ) {
        themeButton.textContent = "Dark mode";
      } else {
        themeButton.textContent = "Light mode";
      }

    });

  </script>

</body>
</html>
